<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Store</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .product-card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; width: 250px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { background-color: #087ea4; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>E-Commerce Catalog</h1>
    <div id="product-list"></div>

    <script>
        fetch('/api/products')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('product-list');
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'product-card';
                    div.innerHTML = `<h3>${item.name}</h3><p>Price: $${item.price}</p><button onclick="alert('Added ${item.name}')">Add to Cart</button>`;
                    list.appendChild(div);
                });
            });
    </script>
</body>
</html>
